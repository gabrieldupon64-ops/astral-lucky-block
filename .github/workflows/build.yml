name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - run: gradle build
        working-directory: astral-mod
      - uses: actions/upload-artifact@v4
        with:
          name: astral-lucky-block-jar
          path: astral-mod/build/libs/*.jar
